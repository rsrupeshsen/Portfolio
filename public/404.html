<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Rupesh Sen</title>
<meta name="description" content="This page does not exist on Rupesh Sen's portfolio. Head back to the home page.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;600&display=swap">
<style>
:root{--paper:#F1EFE8;--ink:#1B1C1F;--muted:#5D5F59;--rule:#C7C6BB;--accent:#B8391A;--on-accent:#FBF8F2;
  --f-display:"Gloock","Iowan Old Style",Georgia,serif;--f-body:"Public Sans","Segoe UI",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root{--paper:#151619;--ink:#ECEAE3;--muted:#A4A59D;--rule:#36383C;--accent:#FF6B45;--on-accent:#151619;color-scheme:dark}}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;overflow-x:clip}
.wrap{width:100%;max-width:1184px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:720px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
header{padding-block:22px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:3px double var(--ink);padding-bottom:12px}
.brand{font-family:var(--f-display);font-size:1.6rem;text-decoration:none;color:var(--ink)}
.mono{font-family:var(--f-mono);font-size:.8125rem;color:var(--muted)}
main{flex:1;padding-block:64px}
.tag{font-family:var(--f-mono);font-size:.875rem;background:var(--accent);color:var(--on-accent);padding:2px 8px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.4rem,7vw,4.8rem);line-height:1.05;margin:18px 0 16px;max-width:16ch;text-wrap:balance}
p{max-width:56ch;font-size:1.1875rem;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:.8125rem;padding:11px 16px;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
footer{padding-block:0 28px}
footer div{border-top:3px double var(--ink);padding-top:16px}
</style>
</head>
<body>
<header class="wrap">
  <div class="top">
    <a class="brand" href="/">Rupesh Sen</a>
    <span class="mono">Release notes · Bengaluru</span>
  </div>
</header>
<main class="wrap">
  <span class="tag">Error 404</span>
  <h1>This page was removed in an earlier release.</h1>
  <p>Or it never shipped. Either way, the link you followed does not lead anywhere on this site.</p>
  <div class="actions">
    <a class="btn primary" href="/">Go to the home page</a>
    <a class="btn" href="/#projects">See my projects</a>
    <a class="btn" href="mailto:rsrupeshsen@gmail.com">Email me</a>
  </div>
</main>
<footer class="wrap"><div class="mono">© 2026 Rupesh Sen · Bengaluru</div></footer>
</body>
</html>
